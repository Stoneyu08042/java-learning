<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生管理</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="#">学生管理</a>
            <nav class="main-nav" aria-label="页面导航">
                <a href="#students">学生列表</a>
                <a href="#add-student">新增学生</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="page-heading" aria-labelledby="page-title">
            <div>
                <p class="eyebrow">JAVA LEARNING</p>
                <h1 id="page-title">学生成绩管理</h1>
                <p class="page-description">
                    使用 JavaScript 动态渲染学生数据，并完成新增和删除。
                </p>
            </div>
            <a class="button primary" href="#add-student">新增学生</a>
        </section>

        <section class="summary" aria-label="学生数据概览">
            <div class="summary-item">
                <span class="summary-label">学生人数</span>
                <strong id="student-count">0</strong>
            </div>
            <div class="summary-item">
                <span class="summary-label">平均成绩</span>
                <strong id="average-score">0</strong>
            </div>
            <div class="summary-item">
                <span class="summary-label">最高成绩</span>
                <strong id="highest-score">0</strong>
            </div>
        </section>

        <section id="students" class="section" aria-labelledby="students-title">
            <div class="section-heading">
                <div>
                    <h2 id="students-title">学生列表</h2>
                    <p>数据暂时保存在浏览器内存中。</p>
                </div>
                <span id="record-count" class="record-count">共 0 条</span>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">姓名</th>
                            <th scope="col">班级</th>
                            <th scope="col">Java 成绩</th>
                            <th scope="col">创建时间</th>
                            <th scope="col">操作</th>
                        </tr>
                    </thead>
                    <tbody id="student-table-body"></tbody>
                </table>
            </div>
        </section>

        <section id="add-student" class="section" aria-labelledby="add-title">
            <div class="section-heading">
                <div>
                    <h2 id="add-title">新增学生</h2>
                    <p>补全 TODO 后即可将学生加入列表。</p>
                </div>
            </div>

            <form id="student-form" class="student-form">
                <div class="form-field">
                    <label for="student-name">姓名</label>
                    <input
                        id="student-name"
                        name="name"
                        type="text"
                        placeholder="例如：张三"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="java-score">Java 成绩</label>
                    <input
                        id="java-score"
                        name="javaScore"
                        type="number"
                        min="0"
                        max="100"
                        step="0.5"
                        placeholder="0 - 100"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="student-class">班级</label>
                    <select
                        id="student-class"
                        name="className"
                        required
                    >
                        <option value="" disabled selected>
                            请选择班级
                        </option>
                        <option value="一班">一班</option>
                        <option value="二班">二班</option>
                        <option value="三班">三班</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button class="button primary" type="submit">
                        新增学生
                    </button>
                </div>

                <p
                    id="form-message"
                    class="form-message"
                    role="status"
                ></p>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>学生管理 JavaScript 交互练习 · Day 15</p>
        </div>
    </footer>
    <script src="app.js" defer></script>
</body>
</html>
